source: https://docs.lengow.io/#api-release-notes
title: API Release Notes
note: >-
  Lengow maintains a dated, categorised API release-note section inside its API documentation rather than
  a separate changelog site. Each entry names a category of change, the impacted API, the release date
  and a description. The published categories are: New feature, Structure change, Data change,
  Deprecation (functionality that will be deprecated) and Removal (functionality that will be removed
  soon) — so breaking-vs-additive intent is stated. Entries are grouped into "Current Release" and
  "Released". Dates are month-precision for recent entries and day-precision for older ones. Recent
  window captured below; the live page is the source of truth.
scheme: dated release notes, categorised by change type, per impacted API
current_version: v3.0 (orders/marketplaces/documents/reports); v1.0 catalogues API in BETA
current_release:
  title: 'Orders: fix on delivery trackings'
  category: Breaking data change
  impacted: Orders API
  date: '2026-05'
  breaking: true
  description: >-
    In some cases (such as one tracking per line) order lines could appear duplicated in delivery
    trackings. The fix removes the duplication and groups lines into trackings correctly.
