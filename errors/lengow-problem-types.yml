note: >-
  Lengow publishes no error-code registry and no application/problem+json media type. Error meaning is
  carried by the HTTP status plus a human-readable message; the numeric `code` in the envelope mirrors
  the HTTP status rather than naming a distinct error condition. The catalogue (v1.0) routes are
  FastAPI-shaped and emit a different validation envelope from the older v3.0 routes — a real
  inconsistency an agent must handle.
