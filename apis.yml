aid: lengow
name: Lengow
description: >-
  Lengow is a French e-commerce automation platform (Nantes, founded 2009; part of the Lengow group alongside
  Netrivals and NetMonitor) that connects merchant product catalogues to marketplaces, price-comparison sites and
  advertising channels across Europe. Its Channel Execution suite covers NetMarkets for marketplace management and
  NetAmplify for advertising feed management, plus NetRivals price intelligence and NetMonitor reseller monitoring.
  Lengow publishes a public REST API at api.lengow.io covering order retrieval and order actions (accept, refuse,
  ship, cancel, refund) across marketplaces, marketplace metadata, invoice and delivery documents, Zalando ZFS
  warehouse communication, product integration reports, and a beta v1.0 catalogue API for products and attributes.
  Authentication is a session token exchanged from an account access_token + secret pair. First-party e-commerce
  plugins are published on GitHub for PrestaShop, Magento 2, WooCommerce, Shopware 6 and Salesforce Commerce Cloud.
