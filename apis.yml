apis:
- name: Lengow Channel Execution API
  description: >-
    REST API for Lengow Channel Execution (NetMarkets marketplace management and NetAmplify ads feed management).
    Covers session-token authentication, per-route rate-limit introspection, marketplace product integration
    reports, and the beta v1.0 Catalogues API for listing, reading, creating, updating and deleting products and
    attributes. Orders, order actions, marketplace metadata and documents are documented in prose at docs.lengow.io
    on the same api.lengow.io host but are not part of the published OpenAPI.
  humanURL: https://api.lengow.io/docs/
  baseURL: https://api.lengow.io
