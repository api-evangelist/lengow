agent_notes:
- Every catalogue tool requires account_id as a query parameter — an agent must be told which account it acts for.
- Batch writes return HTTP 207 with per-item results; the HTTP status alone does not indicate success.
- There is no idempotency key, so a retried write is a real second write.
- The v3.0 order actions (accept, refuse, ship, cancel, refund) are NOT in the published OpenAPI and are
  therefore deliberately absent from this candidate tool list rather than reconstructed from prose.
