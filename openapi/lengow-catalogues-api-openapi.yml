      description: 'Create or replace products in the catalogue.


        This update call is a purge and replace call, meaning the full product will get overwritten with the new payload. Any attribute not included in the payload will be removed (its value will be cleared).


        **Closed Beta – Authorised Users Only**


        This endpoint is under development and available only to approved beta participants.


        Contact [our support](mailto:help@lengow.com).'
      operationId: upsert_products_public_catalogues__catalogue_id__products_post
      parameters:
      - description: The ID of the catalogue
        in: path
        name: catalogue_id
        required: true
        schema:
          description: The ID of the catalogue
          title: Catalogue Id
          type: integer
      - description: The ID of the account
        in: query
        name: account_id
        required: true
        schema:
          description: The ID of the account
          title: Account Id
          type: integer
      requestBody:
        content:
          application/json:
            example:
            - color: red
              id: product_123
              name: T-shirt
              price: 19.99
              size: L
            - color: blue
              id: product_456
              name: Jeans
              price: 49.99
              size: '32'
            schema:
              $ref: '#/components/schemas/UpsertProductsRequest'
        description: 'For each product, specify its new content (full replacement),

          - the keys of each item must be an attribute defined in the catalogue settings (can be retrieved using /catalogues/{catalogue_id}/attributes),

          - the product_id attribute must be specified on each item,

          - other attributes not included in the request will be removed from the product,

          - if several items specify the same product_id, they will be rejected,

          - a request is limited to 10000 items at once.'
        required: true
      responses:
        '207':
          content:
            application/json:
              example:
              - product_id_value: product_123
                status: created
              - product_id_value: product_456
                status: updated
              - errors:
                - 'Unknown attributes for catalogue schema: qrice, ID.'
                product_id_value: product_789
                status: rejected
              schema:
                $ref: '#/components/schemas/UpsertProductsResponse'
          description: A multi-status response with results for each product.
        '404':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.not_found
                  message: Catalogue 123 not found in account 890
          description: Catalogue not found in the specified account.
        '409':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.draft.forbidden_operation
                  message: Cannot perform product operations on draft catalogue 123.
          description: Catalogue is in draft status; operation forbidden.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[BETA] Create or replace products'
