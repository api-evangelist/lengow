                  value:
                    detail:
                      error_code: product.not_found
                      message: Product 'ABC123' not found in catalogue 123
          description: Catalogue or product not found.
        '409':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.draft.forbidden_operation
                  message: Cannot perform product operations on draft catalogue 123.
          description: Catalogue is in draft status, operation forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[BETA] Update product'
      tags:
      - Catalogues
