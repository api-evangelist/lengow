      description: 'Delete a single product from the catalogue.


        To delete a product, you must use the product_id_value (the value of the product identifier mapped in the catalogue settings).


        **Closed Beta – Authorised Users Only**


        This endpoint is under development and available only to approved beta participants.


        Contact [our support](mailto:help@lengow.com).'
      operationId: delete_product_public_catalogues__catalogue_id__products__product_id_value__delete
      parameters:
      - description: The ID of the catalogue
        in: path
        name: catalogue_id
        required: true
        schema:
          description: The ID of the catalogue
          title: Catalogue Id
          type: integer
      - description: The ID of the product to delete
        in: path
        name: product_id_value
        required: true
        schema:
          description: The ID of the product to delete
          title: Product Id Value
          type: string
      - description: The ID of the account
        in: query
        name: account_id
        required: true
        schema:
          description: The ID of the account
          title: Account Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                product_id_value: product_123
                status: deleted
              schema:
                $ref: '#/components/schemas/DeleteProductResponse'
          description: Product successfully deleted.
        '404':
          content:
            application/json:
              examples:
                catalogue_not_found:
                  summary: Catalogue not found
                  value:
                    detail:
                      error_code: catalogue.not_found
                      message: Catalogue 123 not found in account 456
                product_not_found:
                  summary: Product not found
                  value:
                    detail:
                      error_code: product.not_found
                      message: Product 'ABC123' not found in catalogue 123
          description: Catalogue or product not found.
        '409':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.draft.forbidden_operation
                  message: Cannot perform product operations on draft catalogue 123.
          description: Catalogue is in draft status; operation forbidden.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          $ref: '#/components/responses/TooManyRequests'
