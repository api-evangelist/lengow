        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                status: updated
              schema:
                $ref: '#/components/schemas/UpdateProductResponse'
          description: Product updated successfully.
        '400':
          content:
            application/json:
              example:
                detail:
                  error_code: product.validation_error
                  errors:
                  - 'Cannot change ''sku'' from ''123'' to ''456'': product identifiers are not mutable.'
                  - 'Unknown attributes for catalogue schema: ''color'''
