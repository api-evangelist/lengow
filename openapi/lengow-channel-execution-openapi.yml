        catalogue_id:
          title: Catalogue Id
          type: integer
        channels_count:
          title: Channels Count
          type: integer
        name:
          title: Name
          type: string
        product_id_key:
          title: Product Id Key
          type: string
        role:
          title: Role
          type: string
        status:
          title: Status
          type: string
        used_by:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Used By
      required:
      - catalogue_id
      - name
      - status
      - product_id_key
      - role
