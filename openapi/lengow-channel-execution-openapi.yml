      description: 'Update the value of some attributes for many products.


        **Closed Beta – Authorised Users Only**


        This endpoint is under development and available only to approved beta participants.


        Contact [our support](mailto:help@lengow.com).'
      operationId: update_products_public_catalogues__catalogue_id__products_patch
      parameters:
      - description: The ID of the catalogue
        in: path
        name: catalogue_id
        required: true
        schema:
          description: The ID of the catalogue
          title: Catalogue Id
          type: integer
      - description: The ID of the account
        in: query
        name: account_id
        required: true
        schema:
          description: The ID of the account
          title: Account Id
          type: integer
      requestBody:
        content:
          application/json:
            example:
              product_123:
                color: red
                material: cotton
                size: L
              product_456:
                category: clothing
                price: 29.99
                stock: 100
            schema:
              $ref: '#/components/schemas/UpdateProductsRequest'
        description: 'For each product, specify which attributes to update,

          - the key of the dictionary must be a valid product_id_value (can be retrieved using /catalogues/{catalogue_id}/products),

          - the key of the inner dictionary must be an attribute key accepted by the target catalogue (you can retrieve the
          exact list with /catalogues/{catalogue_id}/attributes),

          - a request is limited to 10000 product updates at once.'
        required: true
      responses:
        '207':
          content:
            application/json:
              example:
                product_123:
                  status: updated
                product_456:
                  errors:
                  - Product 'ABC123' not found in catalogue 123.
                  status: rejected
              schema:
                $ref: '#/components/schemas/UpdateProductsResponse'
          description: The result of the update operation for each product.
        '404':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.not_found
                  message: Catalogue 123 not found in account 456
          description: Catalogue not found
        '409':
          content:
            application/json:
              example:
                detail:
                  error_code: catalogue.draft.forbidden_operation
                  message: Cannot update products in a draft catalogue.
          description: Catalogue is in draft status, operation forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          $ref: '#/components/responses/TooManyRequests'
