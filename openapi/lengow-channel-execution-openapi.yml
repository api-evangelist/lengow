      operationId: Get product reports
      parameters:
      - description: feed_id Identifier of the feed.
        in: query
        name: feed_id
        required: true
        schema:
          type: integer
      - description: "Number of days to skip before the last report was received. \n\nWhen nb_days_to_skip equals 0, the last\
          \ digest is returned. \n\nWhen nb_days_to_skip equals 1, the digest of the day before is returned.\n\nFor instance,\
          \ if the last report was received today at 11:03, the last report received yesterday at 11:03 is considered."
        in: query
        name: nb_days_to_skip
        schema:
          default: 0
          type: integer
      - in: path
        name: version
        required: true
        schema:
          pattern: ^[0-9]+(.[0-9]+)?$
          type: string
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          content:
            application/json:
              schema:
                type: object
