        The product_id_key is returned in the JSON response of the Get Catalogue ID endpoint.


        **Closed Beta – Authorised Users Only**


        This endpoint is under development and available only to approved beta participants.


        Contact [our support](mailto:help@lengow.com).'
      operationId: get_product_public_catalogues__catalogue_id__products__product_id_value__get
      parameters:
      - description: The ID of the catalogue
        in: path
        name: catalogue_id
        required: true
        schema:
          description: The ID of the catalogue
          title: Catalogue Id
          type: integer
      - description: The ID of the product to retrieve
        in: path
        name: product_id_value
        required: true
        schema:
          description: The ID of the product to retrieve
          title: Product Id Value
          type: string
      - description: The ID of the account
        in: query
        name: account_id
        required: true
        schema:
          description: The ID of the account
          title: Account Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                SKU: ABC123
                currency: USD
                in_stock: true
                name: Red T-Shirt
                price: 19.99
              schema:
                $ref: '#/components/schemas/GetProductResponse'
          description: Product retrieved successfully.
        '404':
          content:
            application/json:
              examples:
                catalogue_not_found:
                  summary: Catalogue not found
                  value:
                    detail:
                      error_code: catalogue.not_found
                      message: Catalogue 123 not found in account 456
                product_not_found:
                  summary: Product not found
                  value:
                    detail:
                      error_code: product.not_found
                      message: Product 'ABC123' not found in catalogue 123
          description: Catalogue or product not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          $ref: '#/components/responses/TooManyRequests'
