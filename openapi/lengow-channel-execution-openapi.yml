basePath: /
components:
  responses:
    TooManyRequests:
      content:
        application/json:
          example:
            error:
              code: 429
              message: 'Request limitation: 500 reached on /v3.0/orders'
      description: The middleware rate-limit bucket is exhausted
      headers:
        Retry-After:
          description: Seconds until the current fixed window expires
          schema:
            minimum: 0
            type: integer
  schemas:
    AvailableFilters:
      properties:
        error_types:
          description: List of types that can be used to filter errors. Only types with at least one error are returned.
          type: array
        severity_levels:
          description: "List of types that can be\n    used to filter errors. Only types with at least one error are returned."
          type: array
      required:
      - error_types
      - severity_levels
      type: object
    DatabaseStatus:
      properties:
        host:
          description: Database server host
          type: string
        name:
          description: Database name
          type: string
      required:
      - host
      - name
      type: object
    DeleteProductResponse:
      description: Response model for single product deletion.
      properties:
        product_id_value:
          description: The ID of the deleted product
          title: Product Id Value
          type: string
        status:
          description: The deletion status
          title: Status
          type: string
      required:
      - product_id_value
      - status
      title: DeleteProductResponse
      type: object
    DeleteProductsResponse:
      description: Response model for deleting multiple products.
      items:
        $ref: '#/components/schemas/DeleteProductsResponseItem'
      title: DeleteProductsResponse
      type: array
    DeleteProductsResponseItem:
      description: Response item for a single product deletion.
      properties:
        product_id_value:
          title: Product Id Value
          type: string
        status:
          title: Status
          type: string
      required:
      - product_id_value
      - status
      title: DeleteProductsResponseItem
      type: object
    DigestReportOffersEntry:
      properties:
        delta_product_healthy_rate:
          description: Rate delta for healthy products since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_in_error_rate:
          description: Rate delta for products in error since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_in_feed_rate:
          description: Rate of change for products in feed since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_with_warning_rate:
          description: Rate delta for products with warning since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        last_report_date:
          description: Last received report date for this report type.
          nullable: true
          type: string
        products_healthy:
          description: Number of healthy products.
          nullable: true
          type: integer
        products_healthy_rate:
          description: Rate of healthy products.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        products_in_error:
          description: Number of products in error.
          nullable: true
          type: integer
        products_in_feed:
          description: Total number of products in the feed.
          nullable: true
          type: integer
        products_with_warning:
          description: Number of products with warning.
          nullable: true
          type: integer
        timestamp:
          description: 'Report timestamp. Example: "2019-12-24 21:03:00"'
          nullable: true
          type: string
      required:
      - delta_product_healthy_rate
      - delta_products_in_error_rate
      - delta_products_in_feed_rate
      - delta_products_with_warning_rate
      - products_healthy
      - products_healthy_rate
      - products_in_error
      - products_in_feed
      - products_with_warning
      - timestamp
      type: object
    DigestReportProductsEntry:
      properties:
        delta_product_healthy_rate:
          description: Rate delta for healthy products since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_in_error_rate:
          description: Rate delta for products in error since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_in_feed_rate:
          description: Rate of change for products in feed since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        delta_products_with_warning_rate:
          description: Rate delta for products with warning since previous synchronization.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        last_report_date:
          description: Last received report date for this report type.
          nullable: true
          type: string
        products_healthy:
          description: Number of healthy products.
          nullable: true
          type: integer
        products_healthy_rate:
          description: Rate of healthy products.
          format: decimal
          nullable: true
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          type: string
        products_in_error:
          description: Number of products in error.
          nullable: true
          type: integer
        products_in_feed:
          description: Total number of products in the feed.
          nullable: true
          type: integer
        products_with_warning:
          description: Number of products with warning.
          nullable: true
          type: integer
        timestamp:
          description: 'Report timestamp. Example: "2019-12-24 21:03:00"'
          nullable: true
          type: string
      required:
      - delta_product_healthy_rate
      - delta_products_in_error_rate
      - delta_products_in_feed_rate
      - delta_products_with_warning_rate
      - products_healthy
      - products_healthy_rate
      - products_in_error
      - products_in_feed
      - products_with_warning
      - timestamp
      type: object
    DigestResponse:
      properties:
        available_filters:
          $ref: '#/components/schemas/AvailableFilters'
        last_report_date:
          type: string
        measures:
          $ref: '#/components/schemas/Measures'
      required:
      - available_filters
      - last_report_date
      - measures
      type: object
    DigestV2Reports:
      properties:
        offers:
          $ref: '#/components/schemas/DigestReportOffersEntry'
        products:
          $ref: '#/components/schemas/DigestReportProductsEntry'
      required:
      - offers
      - products
      type: object
    DigestV2Response:
      properties:
        reports:
          $ref: '#/components/schemas/DigestV2Reports'
      required:
      - reports
      type: object
    DuplicateRulesRequest:
      examples:
      - rule_ids:
        - 1
        - 2
        - 3
        target_catalogue_ids:
        - 200
        - 201
        user_id: 42
      properties:
        rule_ids:
          items:
            type: integer
          title: Rule Ids
          type: array
          uniqueItems: true
        target_catalogue_ids:
          items:
            type: integer
          title: Target Catalogue Ids
          type: array
          uniqueItems: true
        user_id:
          title: User Id
          type: integer
      required:
      - user_id
      - target_catalogue_ids
      - rule_ids
      title: DuplicateRulesRequest
      type: object
    Error:
      properties:
        attribute:
          $ref: '#/components/schemas/ErrorAttribute'
        code:
          type: string
        error_id:
          type: integer
        header_slug:
          type: string
        impacted_line_id:
          type: integer
        indicator:
          $ref: '#/components/schemas/ErrorIndicator'
        message:
          type: string
        severity:
          nullable: true
          type: string
      required:
      - attribute
      - code
      - error_id
      - header_slug
      - impacted_line_id
      - indicator
      - message
      type: object
    ErrorAttribute:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    ErrorIndicator:
      properties:
        count:
          type: integer
        type:
          type: string
      required:
      - count
      - type
      type: object
    ErrorsResponseSeralizer:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/Error'
          type: array
        total_error_count:
          type: integer
      required:
      - errors
      - total_error_count
      type: object
    GetCatalogueResponse:
      properties:
        additional_sources:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Additional Sources
        catalogue_id:
          title: Catalogue Id
          type: integer
        created_at:
          title: Created At
          type: string
        indexed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Indexed At
        name:
          title: Name
          type: string
        product_id_key:
          title: Product Id Key
          type: string
        products_count:
          title: Products Count
          type: integer
        source:
          title: Source
          type: string
        status:
          title: Status
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - catalogue_id
      - name
      - status
      - product_id_key
      - created_at
      - updated_at
      - indexed_at
      - source
      - products_count
      title: GetCatalogueResponse
      type: object
    GetProductResponse:
      additionalProperties: true
      title: GetProductResponse
      type: object
    GroupsResponse:
      properties:
        error:
          $ref: '#/components/schemas/SeverityResponse'
        slug:
          description: Identifier of the group
          type: string
        warning:
          $ref: '#/components/schemas/SeverityResponse'
      required:
      - error
      - slug
      - warning
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LineErrorCount:
      properties:
        count:
          description: Number of lines in error.
          type: integer
      required:
      - count
      type: object
    LineWarningCount:
      properties:
        count:
          description: Number of lines with warning.
          type: integer
      required:
      - count
      type: object
    ListAttributesResponse:
      $ref: '#/components/schemas/PaginatedResultWithNext_str_'
      title: ListAttributesResponse
    ListCataloguesResponse:
      $ref: '#/components/schemas/PaginatedResultWithNext_ListCataloguesResponseItem_-Output'
      title: ListCataloguesResponse
    ListCataloguesResponseItem-Input:
      properties:
