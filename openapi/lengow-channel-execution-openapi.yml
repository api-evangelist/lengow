    Product:
      properties:
        additional_data:
          description: Additional data attached on product.
          type: object
        errors:
          description: Errors for the product.
          type: object
        feed_id:
          description: Feed id attached for product.
          type: integer
        level:
          type: integer
        message:
          description: Message attached for product.
          type: string
        product_id:
          description: ID of the product.
          type: string
        task_id:
          description: Task ID for the product.
          type: string
        updated_at:
          type: string
      required:
      - additional_data
      - errors
      - feed_id
      - level
      - message
      - product_id
      - task_id
      - updated_at
      type: object
    ProductsErrorCount:
      properties:
        count:
          description: Number of products in error.
